<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>ISPL Auction</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/launcher.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<!-- ================= LAUNCHER ================= -->
<div class="launcher" id="launcher">
  <div class="l-badge">ISPL</div>
  <h1>ISPL <span>Auction</span></h1>
  <p class="sub">Indian Super Premier League — Player Auction &amp; Team Management.<br>Choose how you want to launch.</p>

  <div class="launch-grid">
    <button class="launch-card live" id="launchBtn">
      <span class="pill now">Works Now</span>
      <span class="ico">🌐</span>
      <span class="ttl">Open in Browser</span>
      <span class="dsc">Start the auction instantly.</span>
    </button>
    <button class="launch-card soon" data-notready="Windows">
      <span class="pill later">Coming Soon</span>
      <span class="ico">🪟</span>
      <span class="ttl">Download for Windows</span>
      <span class="dsc">Desktop .exe — in development.</span>
    </button>
    <button class="launch-card soon" data-notready="Mobile">
      <span class="pill later">Coming Soon</span>
      <span class="ico">📱</span>
      <span class="ttl">Download for Mobile</span>
      <span class="dsc">Android / iOS — in development.</span>
    </button>
  </div>
  <div class="launch-foot">v1.0 · Data is saved locally in your browser</div>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">ISPL</div>
      <div>ISPL Auction<em>Indian Super Premier League</em></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-actions">
      <button class="btn sm ghost" data-action="export">⬇ Export</button>
      <button class="btn sm ghost" data-action="reset">↺ Reset</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<!-- Scripts — order matters (classic scripts, no bundler) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/teams.js"></script>
<script src="js/views/players.js"></script>
<script src="js/views/retention.js"></script>
<script src="js/views/auction.js"></script>
<script src="js/app.js"></script>
</body>
</html>
